# Community Cloud runs from the repository root; keep this theme aligned with
# TPC Navbot/.streamlit/config.toml for local project-directory launches.
[browser]
gatherUsageStats = false

[server]
headless = true
port = 8501

[theme]
base = "dark"
primaryColor = "#C6EC9E"
backgroundColor = "#0C1512"
secondaryBackgroundColor = "#13221B"
textColor = "#EDF4EE"
font = "sans serif"
