# Community Cloud runs from the repository root; keep this theme aligned with
# TPC Navbot/.streamlit/config.toml for local project-directory launches.
[browser]
gatherUsageStats = false

[server]
headless = true
port = 8501

[theme]
base = "light"
primaryColor = "#245443"
backgroundColor = "#FDFEFB"
secondaryBackgroundColor = "#F3F5EF"
textColor = "#263B32"
font = "sans serif"
