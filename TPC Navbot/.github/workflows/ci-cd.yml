name: TPC NavBot CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    name: Run Automated Test Suite & RAG Evaluation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run End-to-End Ingestion Pipeline
      run: |
        python src/ingestion.py --force

    - name: Execute Automated Test Suite (15/15 Tests)
      run: |
        python tests/run_tests.py

    - name: Execute Checkpoint 3 Multi-Turn RAG Demo
      run: |
        python scripts/demo_checkpoint3.py

  docker-build:
    name: Build & Verify Docker Image
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Container Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: tpc-navbot:latest
