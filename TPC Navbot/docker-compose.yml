services:
  tpc-navbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tpc_navbot_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TPC_ENABLE_LLM_SELECTION=${TPC_ENABLE_LLM_SELECTION:-0}
      - TPC_EMBEDDING_MODE=${TPC_EMBEDDING_MODE:-auto}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - chroma_data:/app/data/vector_store
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  chroma_data:
    driver: local
