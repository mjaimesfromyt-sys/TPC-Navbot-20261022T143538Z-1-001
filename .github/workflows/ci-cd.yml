name: TPC NavBot verification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  safety-and-storage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TPC Navbot
    env:
      TPC_EMBEDDING_MODE: lexical
      TPC_ENABLE_LLM_SELECTION: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify standard-library fallback and multilingual guardrails
        run: python tests/run_tests.py
      - name: Install framework and web test dependencies
        run: python -m pip install 'streamlit>=1.40,<2' 'python-dotenv>=1,<2' 'langchain-core>=1,<2'
      - name: Verify framework orchestration and web interface
        run: python tests/run_tests.py
      - name: Exercise ingestion and truthful six-query demo
        run: |
          python src/ingestion.py
          python scripts/demo_checkpoint3.py
          python scripts/evaluate_retrieval.py
  container:
    runs-on: ubuntu-latest
    needs: safety-and-storage
    steps:
      - uses: actions/checkout@v4
      - name: Build application container
        run: docker build -t tpc-navbot:ci './TPC Navbot'
      - name: Smoke-test non-root application health
        run: |
          docker run -d --name navbot -p 8501:8501 -e TPC_EMBEDDING_MODE=lexical tpc-navbot:ci
          trap 'docker logs navbot; docker rm -f navbot' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          exit 1
